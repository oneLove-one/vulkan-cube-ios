name: Build Vulkan Cube IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build tools
        run: brew install xcodegen glslang

      - name: Fetch MoltenVK (iOS)
        run: |
          curl -L --retry 3 -o MoltenVK-ios.tar \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          tar xf MoltenVK-ios.tar
          ls MoltenVK/MoltenVK/static

      - name: Compile shaders to SPIR-V
        run: |
          glslangValidator -V Shaders/cube.vert -o Shaders/cube.vert.spv
          glslangValidator -V Shaders/cube.frag -o Shaders/cube.frag.spv
          ls -l Shaders

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project VulkanCube.xcodeproj -scheme VulkanCube \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VulkanCube.app Payload/
          zip -qry VulkanCube.ipa Payload
          ls -lh VulkanCube.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VulkanCube-ipa
          path: VulkanCube.ipa
          retention-days: 30
